<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="AI-Based SOC Anomaly Detection: rules and machine learning for Linux authentication logs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1C2942" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0B1220" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="14" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="14" fill="url(#fade)"/>

  <!-- failed-login signal: quiet baseline, then a burst flagged as an incident -->
  <g transform="translate(700 0)">
    <line x1="0" y1="262" x2="520" y2="262" stroke="#2A3A5C" stroke-width="1"/>
    <g fill="#3A4D75">
      <rect x="6" y="250" width="10" height="12" rx="2"/><rect x="28" y="254" width="10" height="8" rx="2"/>
      <rect x="50" y="246" width="10" height="16" rx="2"/><rect x="72" y="252" width="10" height="10" rx="2"/>
      <rect x="94" y="256" width="10" height="6" rx="2"/><rect x="116" y="248" width="10" height="14" rx="2"/>
      <rect x="138" y="253" width="10" height="9" rx="2"/><rect x="160" y="250" width="10" height="12" rx="2"/>
      <rect x="182" y="255" width="10" height="7" rx="2"/><rect x="204" y="247" width="10" height="15" rx="2"/>
      <rect x="226" y="252" width="10" height="10" rx="2"/><rect x="248" y="249" width="10" height="13" rx="2"/>
      <rect x="402" y="251" width="10" height="11" rx="2"/><rect x="424" y="255" width="10" height="7" rx="2"/>
      <rect x="446" y="248" width="10" height="14" rx="2"/><rect x="468" y="253" width="10" height="9" rx="2"/>
      <rect x="490" y="250" width="10" height="12" rx="2"/>
    </g>
    <g fill="#F79009">
      <rect x="270" y="214" width="10" height="48" rx="2"/><rect x="292" y="170" width="10" height="92" rx="2"/>
    </g>
    <g fill="#F04438">
      <rect x="314" y="112" width="10" height="150" rx="2"/><rect x="336" y="84" width="10" height="178" rx="2"/>
      <rect x="358" y="132" width="10" height="130" rx="2"/>
    </g>
    <rect x="380" y="226" width="10" height="36" rx="2" fill="#F79009"/>
    <rect x="262" y="70" width="136" height="200" rx="8" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="262" y="40" width="136" height="24" rx="6" fill="#2DD4BF"/>
    <text x="330" y="57" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#0B1220">INCIDENT · T1110</text>
    <text x="0" y="286" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5F7396">failed logins / 5 min</text>
  </g>

  <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="3" fill="#2DD4BF">SECURITY OPERATIONS · MACHINE LEARNING</text>
  <text x="64" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" fill="#E6EDF7">AI-Based SOC</text>
  <text x="64" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" fill="#E6EDF7">Anomaly Detection</text>
  <text x="64" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8FA3BF">Detection rules and unsupervised ML that turn raw SSH and sudo</text>
  <text x="64" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8FA3BF">logs into a short list of MITRE ATT&amp;CK-mapped incidents.</text>
</svg>
